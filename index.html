<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguaAI - مترجم احترافي بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-language"></i>
                <span>Lingua<strong>AI</strong></span>
            </div>
            <button class="theme-btn" id="themeToggle" title="تبديل الوضع الليلي">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- القسم الرئيسي -->
    <header class="hero">
        <h1>ترجم أي لغة <span class="gradient-text">بذكاء اصطناعي</span></h1>
        <p>مترجم فوري احترافي يدعم الترجمة النصية، الصوتية، واستيراد الملفات مجاناً.</p>
    </header>

    <!-- قسم المترجم -->
    <section class="translator-section">
        <div class="translator-container">
            
            <!-- اختيار اللغات -->
            <div class="lang-bar">
                <div class="lang-select">
                    <label>من</label>
                    <select id="sourceLang">
                        <option value="auto">🔍 اكتشاف تلقائي</option>
                    </select>
                </div>
                
                <button class="swap-btn" id="swapBtn" title="تبديل اللغات">
                    <i class="fas fa-exchange-alt"></i>
                </button>

                <div class="lang-select">
                    <label>إلى</label>
                    <select id="targetLang">
                        <option value="ar">🇸🇦 العربية</option>
                    </select>
                </div>
            </div>

            <!-- صناديق النص -->
            <div class="boxes-container">
                <!-- صندوق الإدخال -->
                <div class="box">
                    <div class="box-header">
                        <span>النص الأصلي</span>
                        <div class="tools">
                            <!-- زر استيراد ملف -->
                            <label class="icon-btn" title="استيراد ملف TXT">
                                <i class="fas fa-file-import"></i>
                                <input type="file" id="fileInput" accept=".txt" hidden>
                            </label>
                            <button class="icon-btn" id="clearBtn" title="مسح"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    <textarea id="sourceText" placeholder="اكتب هنا أو استخدم الميكروفون..."></textarea>
                    <div class="box-footer">
                        <button class="icon-btn voice-btn" id="voiceBtn" title="ترجمة صوتية (تحدث الآن)">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <button class="icon-btn" id="speakSource" title="استماع للنص"><i class="fas fa-volume-up"></i></button>
                        <span class="char-count"><span id="charCount">0</span>/5000</span>
                    </div>
                </div>

                <!-- صندوق الإخراج -->
                <div class="box output-box">
                    <div class="box-header">
                        <span>الترجمة</span>
                        <div class="tools">
                            <button class="icon-btn" id="copyBtn" title="نسخ"><i class="fas fa-copy"></i></button>
                        </div>
                    </div>
                    <textarea id="targetText" placeholder="ستظهر الترجمة هنا..." readonly></textarea>
                    <div class="box-footer">
                        <button class="icon-btn" id="speakTarget" title="استماع للترجمة"><i class="fas fa-volume-up"></i></button>
                        <span class="status" id="status"></span>
                    </div>
                </div>
            </div>

            <!-- زر الترجمة -->
            <button class="main-btn" id="translateBtn">
                <i class="fas fa-language"></i> ترجم الآن
            </button>

        </div>
    </section>

    <!-- إشعارات -->
    <div class="toast" id="toast">تم النسخ بنجاح!</div>

    <script src="script.js"></script>
</body>
</html>
