<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinguaAI — ترجمة احترافية ذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">🌐</div>
    <div class="brand-text">
      <span class="brand-name">LinguaAI</span>
      <span class="brand-tag">ترجمة احترافية ذكية</span>
    </div>
  </div>
  <button class="theme-btn" id="themeToggle" aria-label="تبديل الوضع">
    <span id="themeIcon">🌙</span>
    <span class="theme-label">الوضع الليلي</span>
  </button>
</header>

<main class="container">

  <section class="hero">
    <h1>ترجم <span class="accent">بذكاء</span> بين 50+ لغة</h1>
    <p>نصوص • ملفات • صوت — بواجهة عربية أنيقة</p>
  </section>

  <section class="translator">
    <div class="lang-bar">
      <div class="lang-field">
        <label for="sourceLang">لغة المصدر</label>
        <select id="sourceLang"></select>
      </div>
      <button class="swap-btn" id="swapBtn" title="تبديل اللغات" aria-label="تبديل">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 16V4M7 4L3 8M7 4l4 4"/>
          <path d="M17 8v12M17 20l4-4M17 20l-4-4"/>
        </svg>
      </button>
      <div class="lang-field">
        <label for="targetLang">لغة الهدف</label>
        <select id="targetLang"></select>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <textarea id="sourceText" placeholder="اكتب النص هنا، أو استورد ملفاً، أو استخدم الميكروفون..." maxlength="5000"></textarea>
        <div class="panel-actions">
          <button class="tool-btn" id="micBtn" title="ترجمة صوتية">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4M8 23h8"/></svg>
            <span>صوتي</span>
          </button>
          <button class="tool-btn" id="importBtn" title="استيراد ملف">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>ملف</span>
          </button>
          <button class="tool-btn" id="clearBtn" title="مسح">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
            <span>مسح</span>
          </button>
          <span class="char-count"><span id="charCount">0</span> / 5000</span>
        </div>
      </div>

      <div class="panel output-panel">
        <div class="output-text" id="outputText">الترجمة ستظهر هنا...</div>
        <div class="panel-actions">
          <button class="tool-btn" id="speakBtn" title="استماع">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <span>استماع</span>
          </button>
          <button class="tool-btn" id="copyBtn" title="نسخ">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>نسخ</span>
          </button>
          <button class="tool-btn" id="saveBtn" title="حفظ في السجل">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
            <span>حفظ</span>
          </button>
        </div>
      </div>
    </div>

    <button class="ai-btn" id="translateBtn">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20"/><path d="M20 7l-4-4-4 4M4 17l4 4 4-4"/></svg>
      <span>ترجم بالذكاء الاصطناعي</span>
    </button>

    <div class="progress-wrap" id="progressWrap" hidden>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">جارٍ المعالجة...</span>
    </div>

    <input type="file" id="fileInput" accept=".txt,.docx,.pdf" hidden>
  </section>

  <section class="history-section">
    <div class="section-head">
      <h2>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        سجل الترجمات
      </h2>
      <div class="section-actions">
        <span class="session-note">يُمسح تلقائياً عند مغادرة الموقع</span>
        <button class="link-btn" id="clearHistory">مسح الكل</button>
      </div>
    </div>
    <div class="history-list" id="historyList">
      <p class="empty-history">لا توجد ترجمات بعد</p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>© 2025 LinguaAI — صُنع بعناية للترجمة العربية</p>
</footer>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
