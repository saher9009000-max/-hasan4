<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaAI - الترجمة الذكية</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- الهيدر -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🌐</span>
      <span class="logo-text">LinguaAI</span>
    </div>
    <nav class="nav">
      <a href="#translator">المترجم</a>
      <a href="#history">السجل</a>
      <a href="#voice">صوتي</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" title="تبديل الوضع">
      <span class="theme-icon">🌙</span>
    </button>
  </header>

  <!-- القسم الرئيسي -->
  <main class="main">

    <!-- عنوان -->
    <section class="hero">
      <h1>ترجم بذكاء مع <span class="gradient-text">الذكاء الاصطناعي</span></h1>
      <p>ترجمة فورية، صوتية، ومستندات — بأكثر من 100 لغة</p>
    </section>

    <!-- صندوق الترجمة -->
    <section class="translator-card" id="translator">

      <!-- اختيار اللغات -->
      <div class="lang-bar">
        <div class="lang-select">
          <label>من</label>
          <select id="sourceLang">
            <option value="auto">🔍 اكتشاف تلقائي</option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="tr">Türkçe</option>
            <option value="it">Italiano</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="hi">हिन्दी</option>
            <option value="ur">اردو</option>
            <option value="fa">فارسی</option>
            <option value="pt">Português</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
            <option value="sv">Svenska</option>
            <option value="he">עברית</option>
            <option value="id">Bahasa</option>
          </select>
        </div>

        <button class="swap-btn" id="swapBtn" title="تبديل">⇄</button>

        <div class="lang-select">
          <label>إلى</label>
          <select id="targetLang">
            <option value="en">English</option>
            <option value="ar" selected>العربية</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="de">Deutsch</option>
            <option value="tr">Türkçe</option>
            <option value="it">Italiano</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="hi">हिन्दी</option>
            <option value="ur">اردو</option>
            <option value="fa">فارسی</option>
            <option value="pt">Português</option>
            <option value="nl">Nederlands</option>
            <option value="pl">Polski</option>
            <option value="sv">Svenska</option>
            <option value="he">עברית</option>
            <option value="id">Bahasa</option>
          </select>
        </div>
      </div>

      <!-- منطقتا النص -->
      <div class="text-area-wrapper">
        <div class="text-box">
          <textarea id="sourceText" placeholder="اكتب النص هنا أو استخدم الميكروفون..."></textarea>
          <div class="text-box-footer">
            <button class="icon-btn" id="micBtn" title="ترجمة صوتية">🎤</button>
            <button class="icon-btn" id="importBtn" title="استيراد ملف">📎</button>
            <button class="icon-btn" id="clearBtn" title="مسح">🗑️</button>
            <span class="char-count" id="charCount">0 / 5000</span>
          </div>
        </div>

        <div class="text-box output-box">
          <div id="outputText" class="output-text">الترجمة ستظهر هنا...</div>
          <div class="text-box-footer">
            <button class="icon-btn" id="speakBtn" title="استماع">🔊</button>
            <button class="icon-btn" id="copyBtn" title="نسخ">📋</button>
            <button class="icon-btn" id="saveBtn" title="حفظ في السجل">💾</button>
          </div>
        </div>
      </div>

      <!-- زر الترجمة -->
      <button class="translate-btn" id="translateBtn">
        <span>ترجم الآن</span>
        <span class="btn-icon">✨</span>
      </button>

      <input type="file" id="fileInput" accept=".txt,.doc,.docx,.pdf" hidden>
    </section>

    <!-- السجل -->
    <section class="history-section" id="history">
      <div class="section-header">
        <h2>📚 سجل الترجمات</h2>
        <button class="clear-history" id="clearHistory">مسح الكل</button>
      </div>
      <div class="history-list" id="historyList">
        <p class="empty-history">لا توجد ترجمات محفوظة بعد</p>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2025 LinguaAI — ترجمة ذكية بلا حدود</p>
  </footer>

  <!-- تنبيه -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
