<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم ذكي | AI Translator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- خلفية متدرجة -->
    <div class="bg-gradient"></div>

    <!-- الهيدر -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-language"></i> مترجم <span>ذكي</span>
        </div>
        <button id="themeToggle" class="theme-btn" title="تبديل الوضع">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container">
        <!-- بطاقة الترجمة -->
        <section class="translator-card">
            <!-- شريط اللغات -->
            <div class="lang-bar">
                <div class="lang-select-wrapper">
                    <label>من</label>
                    <select id="sourceLang"></select>
                </div>
                <button id="swapBtn" class="swap-btn" title="تبديل اللغات">
                    <i class="fas fa-exchange-alt"></i>
                </button>
                <div class="lang-select-wrapper">
                    <label>إلى</label>
                    <select id="targetLang"></select>
                </div>
            </div>

            <!-- صناديق النصوص -->
            <div class="text-panes">
                <div class="pane">
                    <textarea id="inputText" placeholder="اكتب النص هنا أو استخدم الميكروفون..."></textarea>
                    <div class="pane-footer">
                        <span id="charCount">0 / 5000</span>
                        <div class="actions">
                            <button id="micBtn" class="icon-btn" title="إدخال صوتي"><i class="fas fa-microphone"></i></button>
                            <button id="clearBtn" class="icon-btn" title="مسح"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>

                <div class="pane">
                    <textarea id="outputText" placeholder="الترجمة ستظهر هنا..." readonly></textarea>
                    <div class="pane-footer">
                        <span id="statusText"></span>
                        <div class="actions">
                            <button id="speakBtn" class="icon-btn" title="نطق الترجمة"><i class="fas fa-volume-up"></i></button>
                            <button id="copyBtn" class="icon-btn" title="نسخ"><i class="fas fa-copy"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- زر الترجمة -->
            <button id="translateBtn" class="main-btn">
                <i class="fas fa-robot"></i> ترجم بالذكاء الاصطناعي
            </button>
        </section>

        <!-- سجل الترجمة -->
        <section class="history-section">
            <div class="history-header">
                <h2><i class="fas fa-history"></i> سجل الترجمة</h2>
                <button id="clearHistoryBtn" class="clear-history-btn">مسح السجل</button>
            </div>
            <div id="historyList" class="history-list">
                <!-- سيتم إضافة العناصر هنا ديناميكياً -->
                <p class="empty-history">لا يوجد سجل ترجمة بعد.</p>
            </div>
        </section>
    </main>

    <!-- إشعارات -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
