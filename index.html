<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ترجم | Translator Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

  <!-- شريط علوي -->
  <header class="topbar glass">
    <div class="brand"><span class="accent">🌐</span> ترجم <small>Pro</small></div>
    <div class="topbar-actions">
      <button id="btn-settings" class="icon-btn" title="إعدادات المفتاح">⚙️</button>
      <button id="btn-theme" class="icon-btn" title="الوضع">🌙</button>
    </div>
  </header>

  <!-- أزرار اللغات -->
  <section class="lang-bar glass">
    <button class="lang-btn" id="lang-from-btn">
      <span class="lang-flag">🇸🇦</span>
      <span class="lang-name" id="lang-from-name">العربية</span>
    </button>
    <button class="swap-btn" id="swap-btn" title="تبديل">⇄</button>
    <button class="lang-btn" id="lang-to-btn">
      <span class="lang-flag">🇬🇧</span>
      <span class="lang-name" id="lang-to-name">English</span>
    </button>
  </section>

  <!-- لوحة الترجمة -->
  <main class="translator">
    <!-- الإدخال -->
    <div class="card">
      <div class="card-head">
        <span class="card-label">النص الأصلي</span>
        <div class="card-tools">
          <button class="tool-btn" id="btn-import">📎 استيراد</button>
          <button class="tool-btn" id="btn-mic">🎤 صوت</button>
          <button class="tool-btn" id="btn-clear">🗑</button>
        </div>
      </div>
      <textarea id="input-text" placeholder="اكتب النص هنا، أو استورد ملفاً (TXT, SRT)، أو تحدث..."></textarea>
      <div class="card-foot">
        <span id="char-count" style="color: #888;">0 / 5000</span>
        <button class="btn-ai" id="btn-translate">🚀 ترجمة احترافية</button>
      </div>
    </div>

    <!-- الإخراج -->
    <div class="card">
      <div class="card-head">
        <span class="card-label">الترجمة</span>
        <div class="card-tools">
          <button class="tool-btn" id="btn-speak">🔊 استماع</button>
          <button class="tool-btn" id="btn-copy">📋 نسخ</button>
          <button class="tool-btn" id="btn-download">⬇️ تنزيل</button>
        </div>
      </div>
      <div id="output-text" class="output-text">
        <span style="color: #888; font-style: italic;">ستظهر الترجمة هنا...</span>
      </div>
      <div class="card-foot">
        <span id="status-text" style="color: #888;">جاهز</span>
      </div>
    </div>
  </main>

  <!-- نافذة التسجيل الصوتي -->
  <div class="modal" id="voice-modal">
    <div class="modal-box glass" style="text-align: center;">
      <h3 id="voice-status" style="margin-bottom: 20px;">جاري الاستماع...</h3>
      <div class="mic-circle" id="mic-circle" style="font-size: 4rem; margin: 20px auto; width: 120px; height: 120px; border-radius: 50%; background: rgba(212,175,55,0.2); display: flex; align-items: center; justify-content: center; border: 2px solid #d4af37;">🎤</div>
      <button class="btn-ai" id="voice-close" style="width: 100%;">إيقاف التسجيل</button>
    </div>
  </div>

  <!-- نافذة استيراد الملفات -->
  <div class="modal" id="file-modal">
    <div class="modal-box glass">
      <h3 style="margin-bottom: 15px;">📎 استيراد ملف نصي</h3>
      <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">اختر ملفاً بصيغة TXT أو SRT أو VTT ليتم استخراج النص تلقائياً.</p>
      <input type="file" id="file-input" accept=".txt,.srt,.vtt" style="width: 100%; padding: 15px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff;">
      <button class="btn-ai" id="file-close" style="width: 100%; margin-top: 20px;">إلغاء</button>
    </div>
  </div>

  <!-- نافذة الإعدادات (مفتاح API) -->
  <div class="modal" id="settings-modal">
    <div class="modal-box glass">
      <h3 style="margin-bottom: 15px;">⚙️ إعدادات الترجمة</h3>
      <label style="display:block; margin-bottom: 5px; font-size: 0.9rem;">مفتاح OpenAI API</label>
      <input type="password" id="api-key" placeholder="sk-proj-..." style="width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; margin-bottom: 15px;">
      <small style="color: #888; display: block; margin-bottom: 15px;">يتم حفظ المفتاح في متصفحك فقط.</small>
      <button class="btn-ai" id="save-key" style="width: 100%;">حفظ المفتاح</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
